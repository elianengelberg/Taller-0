# Compila el instalador de la app de escritorio EN WINDOWS y lo publica en
# GitHub Releases como "latest". Al final arma también el paquete MSIX para
# la Microsoft Store (queda como artefacto del run: se sube a Partner Center).
#
# Por qué existe: el botón "Descargar Unify para Windows" de /instalar apunta a
#   https://github.com/elianengelberg/Taller-0/releases/latest/download/Unify-Setup.exe
# -- la URL "latest" siempre sirve el último release publicado, así que correr
# este workflow es TODO lo que hace falta para publicar una versión nueva: no
# hay que tocar la web, ni compilar nada a mano, ni tener un Windows.
#
# Se dispara a mano (pestaña Actions → "Instalador de Windows" → Run workflow)
# o solo, cuando un push a la rama principal toca desktop/.
name: Instalador de Windows

on:
  workflow_dispatch: {}
  push:
    # La rama de trabajo está incluida para poder publicar sin esperar el
    # merge; después del merge se puede dejar sólo la principal.
    branches: [main, master, claude/zoom-platform-roles-transcription-4914ju]
    paths: ["desktop/**", ".github/workflows/instalador-windows.yml"]

permissions:
  contents: write # crear el release y adjuntar el .exe

jobs:
  instalador:
    runs-on: windows-latest
    env:
      # La firma se prende SOLA cuando los secretos existen; sin ellos el
      # build sale como hoy (sin firma) y nada se rompe. Dos vías:
      #  - Certificado propio: WINDOWS_CERT_PFX_BASE64 (el .pfx en base64)
      #    + WINDOWS_CERT_PASSWORD. Sirve para cualquier certificado
      #    comprado o el de Azure Trusted Signing exportado.
      #  - SignPath (firma gratuita para código abierto, solicitud en
      #    trámite): SIGNPATH_API_TOKEN + SIGNPATH_ORGANIZATION_ID +
      #    SIGNPATH_PROJECT_SLUG + SIGNPATH_POLICY_SLUG.
      #  - Azure Trusted Signing (la vía recomendada: ~US$10/mes, certificado
      #    emitido por Microsoft con reputación inmediata en SmartScreen):
      #    AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET (la app
      #    registrada en Entra con rol "Trusted Signing Certificate Profile
      #    Signer") + AZURE_SIGNING_ENDPOINT (p. ej.
      #    https://eus.codesigning.azure.net) + AZURE_SIGNING_ACCOUNT +
      #    AZURE_SIGNING_PROFILE + AZURE_PUBLISHER_NAME (el "CN=..." del
      #    perfil). electron-builder firma TODO (app, instalador y
      #    desinstalador) durante el build. Ver desktop/README.md.
      HAY_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      HAY_AZURE: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      HAY_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: desktop
        run: npm install

      - name: Preparar el certificado de firma
        if: env.HAY_PFX == 'true'
        shell: pwsh
        run: >
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\desktop\certificado.pfx",
          [Convert]::FromBase64String($env:PFX_B64))
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}

      - name: Compilar el instalador NSIS (firmado con el certificado)
        if: env.HAY_PFX == 'true'
        working-directory: desktop
        # --publish never: publica el paso siguiente, no electron-builder.
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_LINK: ${{ github.workspace }}\desktop\certificado.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Compilar el instalador NSIS (firmado con Azure Trusted Signing)
        if: env.HAY_AZURE == 'true' && env.HAY_PFX != 'true'
        working-directory: desktop
        # electron-builder instala el módulo TrustedSigning de PowerShell y
        # firma cada .exe con Invoke-TrustedSigning; la identidad sale de los
        # AZURE_* del entorno (una app de Entra con permiso de firma).
        run: >
          npx electron-builder --win nsis --publish never
          -c.win.azureSignOptions.publisherName="${{ secrets.AZURE_PUBLISHER_NAME }}"
          -c.win.azureSignOptions.endpoint="${{ secrets.AZURE_SIGNING_ENDPOINT }}"
          -c.win.azureSignOptions.codeSigningAccountName="${{ secrets.AZURE_SIGNING_ACCOUNT }}"
          -c.win.azureSignOptions.certificateProfileName="${{ secrets.AZURE_SIGNING_PROFILE }}"
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Compilar el instalador NSIS (sin firma todavía)
        if: env.HAY_PFX != 'true' && env.HAY_AZURE != 'true'
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # sin certificado de firma (por ahora)

      # ── Firma vía SignPath (cuando la cuenta esté aprobada) ──
      # SignPath firma el artefacto en SU infraestructura: se le sube el
      # instalador, firma, y se baja firmado antes de publicar.
      - name: Subir el instalador para SignPath
        if: env.HAY_SIGNPATH == 'true' && env.HAY_PFX != 'true' && env.HAY_AZURE != 'true'
        id: artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firma
          path: desktop/dist/Unify-Setup.exe

      - name: Firmar con SignPath
        if: env.HAY_SIGNPATH == 'true' && env.HAY_PFX != 'true' && env.HAY_AZURE != 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefacto.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/dist-firmado

      - name: Publicar la versión firmada por SignPath
        if: env.HAY_SIGNPATH == 'true' && env.HAY_PFX != 'true' && env.HAY_AZURE != 'true'
        shell: pwsh
        run: Copy-Item "desktop\dist-firmado\Unify-Setup.exe" "desktop\dist\Unify-Setup.exe" -Force

      # Firmar cambió los bytes del .exe, así que el sha512 que latest.yml
      # declara ya no coincide -- y el actualizador automático rechaza (bien)
      # una descarga cuyo hash no cierra. Se recalcula sobre el exe firmado.
      - name: Recalcular el hash de latest.yml (exe firmado)
        if: env.HAY_SIGNPATH == 'true' && env.HAY_PFX != 'true' && env.HAY_AZURE != 'true'
        shell: pwsh
        run: |
          $exe = "desktop\dist\Unify-Setup.exe"
          $yml = "desktop\dist\latest.yml"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $sha = [Security.Cryptography.SHA512]::Create().ComputeHash($bytes)
          $b64 = [Convert]::ToBase64String($sha)
          $size = (Get-Item $exe).Length
          $texto = Get-Content $yml -Raw
          $texto = $texto -replace "sha512: .+", "sha512: $b64"
          $texto = $texto -replace "size: \d+", "size: $size"
          Set-Content $yml $texto -NoNewline
          # El blockmap (descarga diferencial) también quedó desfasado: mejor
          # no publicarlo que publicarlo mentiroso; sin él se baja el exe entero.
          Remove-Item "desktop\dist\*.blockmap" -ErrorAction SilentlyContinue

      - name: Publicar en Releases (queda como latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: escritorio-b${{ github.run_number }}
          name: Unify para Windows (build ${{ github.run_number }})
          body: |
            Instalador de la app de escritorio de Unify.

            Detecta tus reuniones de Zoom, pregunta si las querés grabar y las
            guarda en tu historial con subtítulos, traducción e IA.

            **Descarga directa:** Unify-Setup.exe (abajo). Si el build salió
            sin firma digital (la firma está en trámite), Windows puede
            mostrar el aviso de SmartScreen: "Más información" → "Ejecutar de
            todas formas".
          files: |
            desktop/dist/Unify-Setup.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          make_latest: "true"

      # ── Paquete para la MICROSOFT STORE (MSIX/AppX) ──
      # La vía sin avisos: la tienda escanea y FIRMA el paquete con su propio
      # certificado, así que acá sale SIN firmar (electron-builder lo dice:
      # "Windows Store only build"). La identidad tiene que ser EXACTAMENTE la
      # que Partner Center reservó para la app (Producto → Identidad del
      # producto): MSSTORE_IDENTITY_NAME (Package/Identity/Name),
      # MSSTORE_PUBLISHER_ID (Package/Identity/Publisher, el "CN=...") y
      # MSSTORE_PUBLISHER_DISPLAY_NAME. Sin esos secretos se empaqueta igual
      # con una identidad de relleno, para que el circuito esté probado, y el
      # artefacto lo dice en el nombre. MSSTORE_PRODUCT_ID (la "Store ID" de
      # la ficha, p. ej. 9NBLGGH4R315) es opcional: la app lo usa para abrir
      # su ficha desde el menú. Paso a paso en desktop/README.md.
      - name: Compilar el paquete para la Microsoft Store
        id: tienda
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # la tienda firma; acá NUNCA
          MSSTORE_IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER_ID: ${{ secrets.MSSTORE_PUBLISHER_ID }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSSTORE_PUBLISHER_DISPLAY_NAME }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          $conIdentidad = [bool]$env:MSSTORE_IDENTITY_NAME -and [bool]$env:MSSTORE_PUBLISHER_ID
          $nombre = if ($conIdentidad) { $env:MSSTORE_IDENTITY_NAME } else { "Unify" }
          $editor = if ($conIdentidad) { $env:MSSTORE_PUBLISHER_ID } else { "Unify" }
          if ($editor -notmatch '^CN=') { $editor = "CN=$editor" }
          $mostrar = if ($env:MSSTORE_PUBLISHER_DISPLAY_NAME) { $env:MSSTORE_PUBLISHER_DISPLAY_NAME } else { "Unify" }
          $producto = if ($env:MSSTORE_PRODUCT_ID) { $env:MSSTORE_PRODUCT_ID } else { "" }
          "identidad=$(if ($conIdentidad) { 'tienda' } else { 'relleno' })" >> $env:GITHUB_OUTPUT
          npx electron-builder --win appx --publish never `
            "-c.appx.identityName=$nombre" `
            "-c.appx.publisher=$editor" `
            "-c.appx.publisherDisplayName=$mostrar" `
            "-c.extraMetadata.tienda.productId=$producto"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.appx | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Guardar el paquete de la tienda (artefacto del run)
        uses: actions/upload-artifact@v4
        with:
          name: paquete-microsoft-store${{ steps.tienda.outputs.identidad == 'relleno' && '-SIN-identidad-de-tienda' || '' }}
          path: desktop/dist/*.appx
          if-no-files-found: error
